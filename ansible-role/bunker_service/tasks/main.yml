---
# Bunkerweb service deployment — fully self-contained
# Receives: service_name, service_user, service_uid, service_home, service_repo

- name: Deploy static Quadlet files
  ansible.builtin.copy:
    src: "{{ service_repo }}/quadlets/{{ item }}"
    dest: "{{ service_home }}/.config/containers/systemd/"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  loop:
    - shared-network.network
    - proxy.pod
    - promtail-proxy.pod

- name: Template container Quadlet files
  ansible.builtin.template:
    src: "{{ service_repo }}/quadlets/{{ item }}.j2"
    dest: "{{ service_home }}/.config/containers/systemd/{{ item }}"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  loop:
    - bunker-nginx.container
    - bunker-scheduler.container
    - promtail-proxy.container

- name: Ensure configs directory exists
  ansible.builtin.file:
    path: "{{ service_home }}/.config/containers/systemd/configs"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Deploy config files
  ansible.builtin.copy:
    src: "{{ service_repo }}/quadlets/configs/{{ item }}"
    dest: "{{ service_home }}/.config/containers/systemd/configs/{{ item }}"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  loop:
    - promtail-proxy.yaml
    - json_analytics.conf

- name: Template Bunkerweb environment files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ service_home }}/.config/containers/systemd/configs/{{ item }}"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0600'
  loop:
    - bunkerized_nginx.env
    - json_analytics.env

- name: Reload systemd user daemon
  ansible.builtin.command:
    cmd: "machinectl shell {{ service_user }}@ /usr/bin/systemctl --user daemon-reload"
  changed_when: true
  failed_when: false

- name: Restart user manager (triggers Quadlet generator and starts containers)
  ansible.builtin.systemd:
    name: "user@{{ service_uid }}.service"
    state: restarted
    scope: system
  failed_when: false
