---
bunker_service_auto_update: "registry"
bunker_service_nginx_image: "docker.io/bunkerity/bunkerweb:1.6.11"
bunker_service_scheduler_image: "docker.io/bunkerity/bunkerweb-scheduler:1.6.11"

# Resource ceilings for an 8 GB host
bunker_service_nginx_extra_args: "--memory=768M --pids-limit=512 --security-opt=no-new-privileges"
bunker_service_scheduler_extra_args: "--memory=512M --pids-limit=512 --security-opt=no-new-privileges"

# Rootless users have separate container networks, so the Nextcloud pod is
# reached through a host-published port. Two details make this fiddly:
#
#   * It must be an address, not host.containers.internal. nginx resolves
#     upstreams through its `resolver` directive, which never consults
#     /etc/hosts where podman puts that name.
#   * pasta's own host.containers.internal (169.254.1.2) reaches the host's
#     routable addresses but NOT its loopback, so a loopback-bound port is
#     invisible through it. This address is mapped to the host's loopback by
#     the --map-host-loopback option on proxy.pod, which lets Nextcloud publish
#     on 127.0.0.1 instead of every interface.
#
# Any free link-local address works; it exists only inside this pod.
bunker_service_host_loopback_address: "169.254.1.3"
bunker_service_nextcloud_upstream_url: "http://{{ bunker_service_host_loopback_address }}:8080"

# Required, no default: bunker_service_server_name, bunker_service_letsencrypt_email
bunker_service_whitelist_country: "DE CH AT"
# Loopback has no country, so the geo whitelist would otherwise drop local
# health checks without answering them at all.
bunker_service_whitelist_ip: "127.0.0.1"

# BunkerWeb defaults DNS_RESOLVERS to 127.0.0.11, which is Docker's embedded
# DNS and does not exist under rootless Podman. nginx then fails every
# upstream lookup with "Connection refused while resolving" and answers
# nothing at all. pasta puts the real resolvers in the pod's resolv.conf.
bunker_service_dns_resolvers: "169.254.1.1 10.0.2.3"
bunker_service_api_whitelist_ip: "127.0.0.1 10.0.0.0/8"
# On, but logging only. The CRS will flag ordinary Nextcloud traffic until it
# is tuned, so run it in DetectionOnly, read what it would have blocked, then
# switch the rule engine to "On" once the log is quiet.
#   journalctl _UID=1001 | grep -i modsecurity
bunker_service_use_modsecurity: "yes"
bunker_service_modsecurity_sec_rule_engine: "DetectionOnly"
bunker_service_limit_req_rate: "3r/s"

# A single global rate limit throttles a real Nextcloud client: the desktop
# sync, the text editor and preview loading all burst well above 3r/s on paths
# that are not attacks. These per-URL limits come from running the previous
# deployment in anger; drop one only if you know why it was there.
bunker_service_limit_req_urls:
  - {url: /apps, rate: 5r/s}
  - {url: /apps/text/session/sync, rate: 8r/s}
  - {url: /core/preview, rate: 5r/s}
  - {url: /remote.php/, rate: 8r/s}
  - {url: /push/ws, rate: 8r/s}
  - {url: /apps/memories/api/, rate: 8r/s}

# Nextcloud answers 401 routinely during WebDAV auth, and 429 when a client
# backs off. Counting those as bad behaviour gets real clients banned, so the
# list is narrowed to codes that actually indicate abuse.
bunker_service_bad_behavior_status_codes: "400 401 403 405 444"

# Required when USE_MODSECURITY is on: without the exclusions the CRS blocks
# ordinary Nextcloud traffic.
bunker_service_modsecurity_crs_plugins: "nextcloud-rule-exclusions"

bunker_service_log_level: "notice"
bunker_service_auto_lets_encrypt: "yes"
# Mutually exclusive with bunker_service_auto_lets_encrypt: BunkerWeb tries the
# letsencrypt plugin first and does not fall through to selfsigned, so ACME
# must be "no" for this to have any effect.
# Serve a self-signed certificate when Let's Encrypt cannot issue one,
# which is the case before DNS points at the host, and always in the test
# VM. Off by default so a real deployment fails loudly instead of quietly
# serving an untrusted certificate.
bunker_service_generate_self_signed_ssl: "no"
bunker_service_max_client_size: "10G"
